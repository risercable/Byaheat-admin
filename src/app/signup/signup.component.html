<div id="content">
    <div id="content-header">
      <div id="breadcrumb"> <a href="#" title="Go to Home" class="tip-bottom"><i class="icon-home"></i> Home</a><a href="#" class="current">Drivers</a> </div>
      <h1>Drivers Page</h1>
    </div>
    <div class="container-fluid">
        <div class="row-fluid">
          <div class="span8">
            <div class="widget-box">
              <div class="widget-title"> <span class="icon"><i class="icon-ok"></i></span>
                <h5>Add Driver</h5>
              </div>
              <div class="widget-content nopadding">
                <form>
                    <div class="form-group">
                      <label for="exampleInputEmail1">Email address</label>
                      <input class="form-control" id="exampleInputEmail1" type="email" aria-describedby="emailHelp" placeholder="Enter email">
                    </div>
                    <div class="form-group">
                      <label for="exampleInputPassword1">Password</label>
                      <input class="form-control" id="exampleInputPassword1" type="password" placeholder="Password">
                    </div>
                    <div class="form-group">
                      <label for="exampleInputPassword1">Full Name</label>
                      <input class="form-control" id="FullName" [(ngModel)]="signup.fullname" name="fullname" type="text" placeholder="Password">
                    </div>
                    <button (click)="signup()" [disabled]="!email || !password || !fullname" class="btn btn-success btn-block">
                      Signup
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
