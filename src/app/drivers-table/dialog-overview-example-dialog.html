<h1 mat-dialog-title>Details</h1>
<div mat-dialog-content>
  <div class="example-container">
  </div>
  <form class="form-horizontal">
    <input type="hidden" name="id" #id="ngModel" [(ngModel)]="data.id" readonly/>
    <div class="control-group">
      <div class="controls">
        <!-- <label>First Name: </label> -->
        <!-- <input type="text" name="firstName" #name="ngModel" [(ngModel)]="driverService.selectedDriver.firstName" placeholder="First Name" /> -->
        <div class="example-container">
          <mat-form-field>
            <input matInput [(ngModel)]="data.firstName" name="firstName" placeholder="Firstname" readonly>
            <mat-icon matSuffix><i class="mdi mdi-eye" style="font-size: small;"></i></mat-icon>
          </mat-form-field>
        </div>
        <!-- <label>Last Name: </label>
        <input type="text" name="lastName" #name="ngModel" [(ngModel)]="driverService.selectedDriver.lastName" placeholder="Last Name" /> -->
        <div class="example-container">
          <mat-form-field>
            <input matInput name="lastName" [(ngModel)]="data.lastName" placeholder="Last Name" readonly>
            <mat-icon matSuffix><i class="mdi mdi-eye" style="font-size: small;"></i></mat-icon>
          </mat-form-field>
        </div>
      </div>
    </div>
    <div class="control-group">
      <!-- <label class="control-label">Birthdate: </label> -->
      <div class="controls">
        <mat-form-field>
          <input matInput name="birthDate" [ngModel]="data.birthDate | date:'MM/dd/yy'" (ngModelChange)="data.theKey.birthDate=$event" placeholder="Birthdate" readonly>
          <mat-icon matSuffix><i class="mdi mdi-eye" style="font-size: small;"></i></mat-icon>
        </mat-form-field>
      </div>
    </div>
    <div class="control-group">
      <!-- <label class="control-label">Address: </label> -->
      <div class="controls">
      </div>
    </div>
    <div class="control-group">
      <!-- <label class="control-label">Mobile: </label> -->
      <div class="controls">
        <!-- <input type="number" class="form-control" name="mobile" #name="ngModel" [(ngModel)]="driverService.selectedDriver.mobile" placeholder="Salary" /> -->
        <div class="example-container">
          <mat-form-field>
            <input matInput class="form-control" name="mobile" [(ngModel)]="data.mobile" placeholder="Mobile Number" readonly>
            <mat-icon matSuffix><i class="mdi mdi-eye" style="font-size: small;"></i></mat-icon>
          </mat-form-field>
        </div>
      </div>
    </div>
    <div class="form-actions">
      <!-- <button type="submit" class="btn btn-success pull-right" [disabled]="!driverForm.valid" onclick="$('.modal').modal('hide')"><span class="icon"><i class="fa fa-save"></i></span> Submit</button> -->
      <!--<button type="submit" class="pull-right" mat-raised-button color="primary"><span class="icon"><i class="fa fa-save"></i></span> Submit</button>-->
    </div>
  </form>
</div>
<div mat-dialog-actions>
  <button class="btn btn-success" (click)="onNoClick()">Cancel</button>
  <!-- <button mat-button (click)="onSubmit(driverForm)" cdkFocusInitial>Ok</button> -->
</div>
