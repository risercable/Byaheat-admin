<div id="content">
  <div id="content-header">
    <div id="breadcrumb"> <a href="#" title="Go to Home" class="tip-bottom"><i class="icon-home"></i> Home</a><a href="#" class="current">Table</a> </div>
    <h1>Drivers Table</h1>
  </div>
  <div class="container-fluid">
      <div class="row-fluid">
        <div class="span11">
          <div class="widget-box">
            <div class="widget-title"> <span class="icon"><i class="icon-pencil"></i></span>
              <h5>Driver Table</h5>
            </div>
            <div class="widget-content nopadding">
                <div class="alert alert-success" *ngIf="driverService.emailadded == true">
                    <button class="close" data-dismiss="alert" (click)="resetAlert()">×</button>
                    <strong>Success!</strong> Added email address to the driver</div>
                <div class="alert alert-success" *ngIf="driverService.deldriver == true">
                    <button class="close" data-dismiss="alert" (click)="resetAlert()">×</button>
                    <strong>Success!</strong> Driver info deleted</div>
                <div class="alert alert-success" *ngIf="driverService.updriver == true">
                    <button class="close" data-dismiss="alert" (click)="resetAlert()">×</button>
                    <strong>Success!</strong> Updated driver info</div>
                    <div class="con">
                        <button (click)="onPrint()" class="btn btn-primary" style="margin-right: 10px;">PRINT</button>
                        <!-- Sort by:
                      <select class='select-option' [(ngModel)]='optionSelected' (ngModelChange)='onOptionSelected($event)' style="width: auto; margin-top: 10px;">
                        <option class='option' selected [value]="10">{{10}}</option>
                        <option class='option' [value]="20">{{20}}</option>
                        <option class='option' [value]="30">{{50}}</option>
                        <option class='option' [value]="999">ALL</option>
                    </select> -->
                        <mat-form-field  style="width: 100px;">
                          <mat-select placeholder="Sort by" [(ngModel)]='optionSelected' (ngModelChange)='onOptionSelected($event)'>
                            <mat-option value="10">{{10}}</mat-option>
                            <mat-option value="20">{{20}}</mat-option>
                            <mat-option value="30">{{30}}</mat-option>
                            <mat-option value="999">ALL</mat-option>
                          </mat-select>
                        </mat-form-field>
                    </div>
                    <!-- <input type="text" [(ngModel)]="term" placeholder="Enter search term" style="float: right; margin: 4px auto;"> -->
                    <div class="con2">
                      <mat-form-field>
                          <input matInput [(ngModel)]="term" placeholder="Enter search term" style="float: right; margin: 4px auto;">
                      </mat-form-field>
                    </div>
                <table class="table table-bordered table-striped" id="basic-table">
                    <thead>
                      <tr>
                        <th hidden>Key</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>EDIT</th>
                        <!-- <th>Assigned Car</th>
                        <th>Edit</th> -->
                      </tr>
                    </thead>
                    <tbody>
                      <tr class="odd gradeX" *ngFor="let driver of driverlist | filter: term | paginate: { itemsPerPage: this.ipp, currentPage: p } let i = index " (click)="onItemClick(driver)" (click)="setClickedRow(i)" [class.active]="i == selectedRow">
                        <td hidden><input type="hidden" name="$key" #$key="ngModel" [(ngModel)]="driverService.selectedDriver.$key" /></td>
                        <td [ngClass]="[inlineOne]">{{driver.user_firstname}}</td>
                        <td [ngClass]="[inlineOne]">{{driver.user_lastname}}</td>
                        <td [ngClass]="[inlineOne]">{{driver.user_email}}</td>
                        <td [ngClass]="[inlineOne]"><a class="btn btn-mini btn-primary" (click)="openDialog(driver.key)"><span class="fas fa-edit" ></span> EDIT INFO</a></td>
                        <!-- <td *ngIf="driver.assigned_car == 'none'">{{driver.assigned_car}}</td>
                        <td *ngIf="driver.assigned_car != 'none'">{{driver.assigned_car.car_plate_number}}</td>
                        <td><a href="" class="btn btn-mini btn-primary" data-toggle="modal" data-target="#myModal" (click)="passKey(driver.key)"><span class="fas fa-edit" ></span> EDIT INFO</a></td>
                        <td *ngIf="driver.email == 'wala@gmail.com'"><a href="" data-toggle="modal" data-target="#addModal"><button class="btn btn-mini btn-success"><span class="icon"><i class="fas fa-plus-square"></i></span> ADD THIS DRIVER</button></a></td> -->
                      </tr>
                    </tbody>
                  </table>
                  <pagination-controls (pageChange)="p = $event"></pagination-controls>
            </div>
          </div>
        </div>
      </div>
  </div>
