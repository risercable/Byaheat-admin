<div class="container-fluid">
  <div class="row">
    <div class="col-12 bg-image text-center">
      <div class="wrapperWelcome"  *ngIf="isLoginOrRegister">
        <h1 class="text-white middleWrapper">Lakbay</h1>
        <p class="middleWrapper">Your journey starts here.</p>
        <button class="btn btn-primary get-started-btn middleWrapper" (click)="hideWelcome()">Get Started</button>
      </div>
      <div class="container-fluid" *ngIf="!isLoginOrRegister">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
          <div class="col-md-3">
            <!-- Card Design -->
            <mat-card class="register-card">
              <mat-card-header>
                <mat-card-title class="text-center">Register</mat-card-title>
              </mat-card-header>
              <mat-card-content>
                <form (ngSubmit)="onRegister()" #registerForm="ngForm" class="register-form">
                  <!-- Email Input -->
                  <mat-form-field class="full-width" appearance="fill">
                    <mat-label>Email</mat-label>
                    <input matInput type="email" name="email" [(ngModel)]="email" required email>
                    <mat-error *ngIf="registerForm.controls.email?.invalid">Please enter a valid email address.</mat-error>
                  </mat-form-field>

                  <!-- Password Input -->
                  <mat-form-field class="full-width" appearance="fill">
                    <mat-label>Password</mat-label>
                    <input matInput type="password" name="password" [(ngModel)]="password" required minlength="6">
                    <mat-error *ngIf="registerForm.controls.password?.invalid">Password must be at least 6 characters.</mat-error>
                  </mat-form-field>

                  <!-- First Name Input -->
                  <mat-form-field class="full-width" appearance="fill">
                    <mat-label>Email</mat-label>
                    <input matInput type="text" name="firstName" [(ngModel)]="firstName" required>
                    <mat-error *ngIf="registerForm.controls.email?.invalid">Please enter a valid email address.</mat-error>
                  </mat-form-field>

                  <!-- Last Name Input -->
                  <mat-form-field class="full-width" appearance="fill">
                    <mat-label>Email</mat-label>
                    <input matInput type="text" name="lastName" [(ngModel)]="lastName" required>
                    <mat-error *ngIf="registerForm.controls.email?.invalid">Please enter a valid email address.</mat-error>
                  </mat-form-field>

                  <!-- Submit Button -->
                  <div class="text-center">
                    <button mat-raised-button color="primary" type="submit" [disabled]="registerForm.invalid">Register</button>
                  </div>
                </form>
              </mat-card-content>

              <mat-card-actions class="text-center">
                <!-- Already Have Account Link -->
                <p class="mt-3">
                  Already have an account? 
                  <a routerLink="/login" class="login-link">Login here</a>
                </p>
              </mat-card-actions>
            </mat-card>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
