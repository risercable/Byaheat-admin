<div id="content" *ngIf="authService.user | async">
    <div class="container">
        <h1>Welcome {{ (authService.user | async)?.email }}!</h1>
    </div>
</div>

<div id="loginbox" *ngIf="!(authService.user | async)">
<div class="control-group normal_text"> <h3><img src="../../assets/img/logo.png" alt="Logo" /></h3></div>
      <div class="control-group">
          <div class="controls">
              <div class="main_input_box">
                  <span class="add-on bg_lg"><i class="icon-user"> </i></span><input id="exampleInputEmail1" type="text" [(ngModel)]="email" aria-describedby="emailHelp" placeholder="Enter email" />
              </div>
          </div>
      </div>
      <div class="control-group">
          <div class="controls">
              <div class="main_input_box">
                  <span class="add-on bg_ly"><i class="icon-lock"></i></span><input id="exampleInputPassword1" type="password" [(ngModel)]="password" placeholder="Password" />
              </div>
          </div>
      </div>
      <div class="form-actions">
          <span class="pull-left"><button (click)="hideShow=(hideShow ? false : true)" class="flip-link btn btn-info" id="to-recover">Lost password?</button></span>
          <span class="pull-right"><button (click)="login()" [disabled]="!email || !password" class="btn btn-success" style="float: right;">
              Login
            </button></span>
      </div>
      <div class="container" *ngIf="hideShow">
          <p class="normal_text">Enter your e-mail address below and we will send you instructions how to recover a password.</p>

          <div class="controls">
              <div class="main_input_box">
                  <span class="add-on bg_lo"><i class="icon-envelope"></i></span><input type="text" placeholder="E-mail address" />
              </div>
          </div>

      <div class="form-actions">
          <span class="pull-right"><a class="btn btn-info">Reecover</a></span>
      </div>
      </div>
</div>
