<div id="content">
  <div id="content-header">
      <div id="breadcrumb"> <a href="index.html" title="Go to Home" class="tip-bottom"><i class="icon-home"></i> Home</a><a href="#" class="current">Users</a></div>
  </div>
  <div class="container-fluid">
    <hr>
    <div class="row-fluid">
      <div class="span12">
        <div class="widget-box">
          <div class="widget-title"> <span class="icon"> <i class="icon-pencil"></i> </span>
            <h5>Users Table</h5>
          </div>
          <div class="widget-content nopadding">
            <!-- <button (click)="onAll()">ALL</button> -->
            <button (click)="onPrint()" class="btn btn-primary" download="...">PRINT</button>
            Sort by:
            <select class='select-option' [(ngModel)]='optionSelected' (ngModelChange)='onOptionSelected($event)' style="width: auto;">
              <option class='option' [value]="10">{{10}}</option>
              <option class='option' [value]="20">{{20}}</option>
              <option class='option' [value]="30">{{50}}</option>
              <option class='option' [value]="999">ALL</option>
          </select>
              <input type="text" [(ngModel)]="term" placeholder="Enter search term" style="float: right; margin: 4px auto;">
            <table class="table table-bordered table-striped" id="basic-table">
              <thead>
                <tr>
                  <th hidden></th>
                  <th>User Firstname</th>
                  <th>User Lastname</th>
                  <th>User Birthdate</th>
                  <th>User Mobile</th>
                </tr>
              </thead>
              <tbody *ngFor="let client of clients | async | filter:term | paginate: { itemsPerPage: this.ipp, currentPage: p }" (click)="onItemClick(client)">
                <tr class="odd gradeX">
                  <td hidden><input type="hidden" name="$key" #$key="ngModel" [(ngModel)]="clientService.selectedClient.$key" /></td>
                  <td>{{client.user_firstname}}</td>
                  <td>{{client.user_lastname}}</td>
                  <td>{{client.user_birthdate}}</td>
                  <td>{{client.user_mobile}}</td>
                </tr>

              </tbody>
            </table>
            <pagination-controls (pageChange)="p = $event"></pagination-controls>
          </div>
        </div>
  </div>
</div>
  </div>
  <!-- Modal -->
<div id="myModal" class="modal fade" role="dialog">
  <div class="modal-dialog">

    <!-- Modal content-->
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title"></h4>
      </div>
      <div class="modal-body">
          <form #clientForm="ngForm" (ngSubmit)="onSubmit(clientForm)" class="form-horizontal">
                <input type="hidden" name="$key" #$key="ngModel" [(ngModel)]="clientService.selectedClient.$key" />
            <div class="control-group">
                <label class="control-label">User Firstname: </label>
                <div class="controls">
                  <input type="text" name="user_firstname" #name="ngModel" [(ngModel)]="clientService.selectedClient.user_firstname"/>
                </div>
              </div>
              <div class="control-group">
                  <label class="control-label">User Lastname: </label>
                  <div class="controls">
                      <input type="text" class="form-control" name="user_lastname" #name="ngModel" [(ngModel)]="clientService.selectedClient.user_lastname" />
                  </div>
                </div>
                <div class="control-group">
                    <label class="control-label">User Birthdate: </label>
                    <div class="controls">
                        <input type="text" class="form-control" name="user_birthdate" #name="ngModel" [(ngModel)]="clientService.selectedClient.user_birthdate" />
                    </div>
                  </div>
                <div class="control-group">
                  <label class="control-label">User Mobilenumber: </label>
                  <div class="controls">
                      <input type="text" class="form-control" name="user_mobile" #name="ngModel" [(ngModel)]="clientService.selectedClient.user_mobile" />
                  </div>
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn btn-success pull-right" [disabled]="!clientForm.valid" onclick="$('.modal').modal('hide')"><span class="icon"><i class="fa fa-save"></i></span> Submit</button>
                </div>
          </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
      </div>
    </div>

  </div>
</div>
</div>
