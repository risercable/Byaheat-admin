<!-- Page wrapper  -->
<!-- ============================================================== -->
<div class="page-wrapper">
  <!-- ============================================================== -->
  <!-- Bread crumb and right sidebar toggle -->
  <!-- ============================================================== -->
  <div class="page-breadcrumb">
    <div class="row">
      <div class="col-12 d-flex no-block align-items-center">
        <h4 class="page-title">Clients</h4><br>
        <div class="ml-auto text-right">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a routerLink="../../home">Home</a></li>
              <li class="breadcrumb-item active" aria-current="page">Clients</li>
            </ol>
          </nav>
        </div>
      </div>
    </div>
  </div>
  <!-- ============================================================== -->
  <!-- End Bread crumb and right sidebar toggle -->
  <!-- ============================================================== -->
  <!-- ============================================================== -->
  <!-- Container fluid  -->
  <!-- ============================================================== -->
  <div class="container-fluid">
    <hr>
    <div class="row-fluid">
      <div class="span12">
        <div class="widget-box">
          <div class="widget-title"> <span class="icon"> <i class="icon-pencil"></i> </span>
            <h5>Users Table</h5>
          </div>
          <div class="widget-content nopadding">
          </div>
        </div>
      </div>
    </div>
    <!-- ============================================================== -->
    <!-- Start Page Content -->
    <!-- ============================================================== -->
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <div class="row justify-content-center align-items-center">
              <div class="col-12">
                <!-- Search bar (always visible) -->
                <mat-card>
                  <div class="container h-100">
                    <div class="row h-100 justify-content-center align-items-center">
                      <mat-form-field style="width: 400px; text-align: center;" class="col-6">
                        <input
                          class="text-center"
                          matInput
                          (keyup)="applyFilter($event.target.value)"
                          [(ngModel)]="searchX"
                          (ngModelChange)="isEmptyString()"
                          placeholder="Enter your search term here..."
                          maxlength="30"
                          matTooltip="*Maximum characters is 30"
                          matTooltipPosition="below">
                      </mat-form-field>
                    </div>
                  </div>
                </mat-card>

                <div class="row h-100 justify-content-center align-items-center" [hidden]="hideTableX">
                  <mat-card *ngIf="clientSource?.filteredData.length" style="width: 100%">
                    <mat-table #table [dataSource]="clientSource" matSort id="basic-table" class="col-12 table-responsive">

                    <!--- Note that these columns can be defined in any order.
                          The actual rendered columns are set as a property on the row definition" -->
                    <ng-container matColumnDef="in1">
                      <mat-header-cell *matHeaderCellDef mat-sort-header>No</mat-header-cell>
                      <mat-cell *matCellDef="let celement"> {{celement.in1}} </mat-cell>
                    </ng-container>
                    <!--<ng-container matColumnDef="in1">-->
                    <!--<mat-header-cell *matHeaderCellDef mat-sort-header>No</mat-header-cell>-->
                    <!--<mat-cell *matCellDef="let celement"> {{celement.in1}} </mat-cell>-->
                    <!--</ng-container>-->
                    <!-- Position Column -->
                    <ng-container matColumnDef="user_firstname">
                      <mat-header-cell *matHeaderCellDef mat-sort-header>Firstname</mat-header-cell>
                      <mat-cell *matCellDef="let element"> {{element.user_firstname}} </mat-cell>
                    </ng-container>

                    <!-- Name Column -->
                    <ng-container matColumnDef="user_lastname">
                      <mat-header-cell *matHeaderCellDef mat-sort-header>Lastname </mat-header-cell>
                      <mat-cell *matCellDef="let element"> {{element.user_lastname}} </mat-cell>
                    </ng-container>

                    <!-- Weight Column -->
                    <ng-container matColumnDef="user_birthdate">
                      <mat-header-cell *matHeaderCellDef mat-sort-header>Birthdate</mat-header-cell>
                      <mat-cell *matCellDef="let element"> {{element.user_birthdate}} </mat-cell>
                    </ng-container>

                    <!-- Symbol Column -->
                    <ng-container matColumnDef="user_mobile">
                      <mat-header-cell *matHeaderCellDef mat-sort-header>Mobile Number </mat-header-cell>
                      <mat-cell *matCellDef="let element"> {{element.user_mobile}} </mat-cell>
                    </ng-container>

                    <!--<ng-container matColumnDef="timestamp">-->
                    <!--<mat-header-cell *matHeaderCellDef mat-sort-header> Time </mat-header-cell>-->
                    <!--<mat-cell *matCellDef="let element"> {{element.timestamp * 1000 | date:'yyyy-MM-dd HH:mm:ss Z'}} </mat-cell>-->
                    <!--</ng-container>-->

                    <ng-container matColumnDef="actions">
                      <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
                      <mat-cell *matCellDef="let element" style="white-space: nowrap;">
                        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                          <!-- Icon button with consistent spacing -->
                          <button mat-icon-button color="accent" (click)="openDialog(element)" title="View Details">
                            <i class="mdi mdi-open-in-new"></i>
                          </button>

                          <!-- Optional conditional button -->
                          <button
                            mat-button
                            class="btn btn-outline-info"
                            (click)="onSelect(element)"
                            *ngIf="element.latest_ride_id !== 'none'"
                            style="font-size: 12px;">
                            History Details
                          </button>

                          <!-- Conditional text for no history -->
                          <span
                            *ngIf="element.latest_ride_id === 'none'"
                            style="color: red; margin-left: 8px; font-size: 12px;"> No Ride History </span>
                        </div>
                      </mat-cell>
                    </ng-container>

                    <mat-header-row *matHeaderRowDef="clientColumns"></mat-header-row>
                    <mat-row *matRowDef="let row; columns: clientColumns;"></mat-row>

                    </mat-table>
                  </mat-card>
                </div>
                <mat-paginator #paginator
                               [pageSize]="5"
                               [pageSizeOptions]="[5, 10, 20]"
                               [showFirstLastButtons]="true">
                </mat-paginator>

                <mat-card  *ngIf="noRecords" style="padding:100px;">
                  <h3 style="text-align:center">We couldn't find data for
                    <span style="color:red">"{{clientSource.filter}}"</span>
                  </h3>
                </mat-card>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
